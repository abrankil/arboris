name: Dependency reconcile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Pin React DOM to the Expo SDK 57 React line
        run: npm install react-dom@19.2.3 --save-exact --package-lock-only

      - name: Verify clean npm install without legacy peer resolution
        run: npm ci

      - name: Commit reconciled dependency files if changed
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency graph already reconciled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deps: align react-dom with Expo SDK 57 React"
          git push
