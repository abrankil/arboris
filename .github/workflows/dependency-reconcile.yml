name: Dependency reconcile

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Pin React DOM to the Expo SDK 57 React line
        run: npm install react-dom@19.2.3 --save-exact --package-lock-only

      - name: Verify clean npm install without legacy peer resolution
        run: npm ci

      - name: Stage reconciled dependency files
        run: |
          mkdir -p dependency-reconcile
          cp package.json package-lock.json dependency-reconcile/

      - name: Upload reconciled dependency files
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reconcile
          path: dependency-reconcile/
          if-no-files-found: error
          retention-days: 1
